<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Interagood | App Dashboard</title>
  <meta name="theme-color" content="#0b1f3a">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="style.css?v=20261111-a">
  <link rel="stylesheet" href="partner.css?v=20261114a">
  <style>
    :root { --app-bg: #f3f5f8; --app-card: #ffffff; --app-line: #e2e8f0; --app-navy: #0b1f3a; --app-orange: #f58220; --app-green: #1f9d55; }
    * { box-sizing: border-box; }
    body.app-body { margin: 0; background: var(--app-bg); color: #0f172a; font-family: inherit; min-height: 100vh; padding-bottom: 84px; }

    /* Sticky Top App Header: Left Address · Right Online Toggle */
    .app-topbar { position: sticky; top: 0; z-index: 40; background: rgba(255, 255, 255, 0.94); backdrop-filter: blur(10px); border-bottom: 1px solid var(--app-line); }
    .app-topbar-inner { max-width: 960px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 58px; }
    .app-addr-box { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
    .app-pin-ic { width: 36px; height: 36px; border-radius: 10px; background: #fff3e6; color: #c76200; display: grid; place-items: center; flex: none; }
    .app-pin-ic svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .app-addr-txt { min-width: 0; }
    .app-addr-kicker { font-size: 0.72rem; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 0.04em; line-height: 1.1; }
    .app-addr-val { font-size: 0.9rem; font-weight: 700; color: var(--app-navy); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .app-online-wrap { display: flex; align-items: center; gap: 8px; flex: none; min-height: 44px; }
    .app-online-txt { font-size: 0.84rem; font-weight: 800; }
    .app-online-txt.on { color: var(--app-green); }
    .app-online-txt.off { color: #64748b; }

    /* App Shell Content Container */
    .app-main { max-width: 960px; margin: 0 auto; padding: 16px 16px 28px; display: grid; gap: 14px; }

    /* Billing Card */
    .bill-card { background: var(--app-navy); color: #fff; border-radius: 18px; padding: 18px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px; }
    .bill-info { min-width: 200px; flex: 1; }
    .bill-title-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 0.84rem; color: #cbd5e1; font-weight: 600; }
    .bill-status-main { font-size: 1.15rem; font-weight: 800; color: #fff; margin: 0 0 4px; }
    .bill-next-date { font-size: 0.84rem; color: #94a3b8; font-variant-numeric: tabular-nums; }
    .bill-action-btn { min-height: 44px; padding: 10px 18px; border-radius: 12px; border: 0; font: inherit; font-size: 0.88rem; font-weight: 800; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; transition: transform 0.15s, background 0.15s; }
    .bill-action-btn.is-active { background: #1f9d55; color: #fff; }
    .bill-action-btn.is-pay-live { background: #f58220; color: #fff; box-shadow: 0 4px 14px rgba(245, 130, 32, 0.35); }
    .bill-action-btn:active { transform: scale(0.97); }

    /* Daily Upload Countdown Grid */
    .limit-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    @media (max-width: 560px) { .limit-grid { grid-template-columns: 1fr; } }
    .limit-card { background: var(--app-card); border: 1px solid var(--app-line); border-radius: 16px; padding: 14px 16px; }
    .limit-top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
    .limit-title { font-size: 0.8rem; font-weight: 700; color: #475569; }
    .limit-count { font-size: 1.08rem; font-weight: 800; color: var(--app-navy); font-variant-numeric: tabular-nums; }
    .limit-sub { font-size: 0.78rem; color: #64748b; margin-top: 6px; font-variant-numeric: tabular-nums; }
    .quota-bar { height: 7px; background: #e2e8f0; border-radius: 999px; overflow: hidden; }
    .quota-fill { height: 100%; background: var(--app-green); transition: width 0.25s; }
    .quota-fill.full { background: #dc2626; }

    /* Two Primary CTA Buttons: List Product & Upload Samples */
    .cta-pair { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .app-cta-btn { min-height: 50px; border-radius: 14px; border: 1.5px solid transparent; font: inherit; font-size: 0.94rem; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: transform 0.15s; white-space: nowrap; }
    .app-cta-btn:active { transform: scale(0.98); }
    .app-cta-btn.primary { background: var(--app-orange); color: #fff; }
    .app-cta-btn.secondary { background: #fff; border-color: var(--app-navy); color: var(--app-navy); }

    /* Feed Sections */
    .app-section { background: var(--app-card); border: 1px solid var(--app-line); border-radius: 16px; padding: 16px; }
    .app-sec-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
    .app-sec-head h2 { margin: 0; font-size: 1.05rem; color: var(--app-navy); }
    .app-sec-meta { font-size: 0.8rem; color: #64748b; font-variant-numeric: tabular-nums; }
    .app-items-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
    .app-item-card { border: 1px solid var(--app-line); border-radius: 14px; overflow: hidden; background: #fff; display: flex; flex-direction: column; }
    .app-item-media { aspect-ratio: 16 / 10; background: #e2e8f0; position: relative; overflow: hidden; }
    .app-item-media img, .app-item-media video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .app-item-body { padding: 12px; display: flex; flex-direction: column; gap: 5px; flex: 1; }
    .app-item-title { margin: 0; font-size: 0.95rem; font-weight: 700; color: var(--app-navy); }
    .app-item-desc { font-size: 0.8rem; color: #475569; line-height: 1.4; }
    .app-item-price { font-size: 0.96rem; font-weight: 800; color: var(--app-navy); font-variant-numeric: tabular-nums; margin-top: auto; padding-top: 4px; }
    .with-mat-tag { color: #15803d; font-size: 0.78rem; font-weight: 800; }
    .item-del-btn { align-self: flex-start; margin-top: 6px; min-height: 36px; padding: 6px 12px; border: 1px solid #fecaca; background: #fef2f2; color: #b91c1c; border-radius: 8px; font: inherit; font-size: 0.78rem; font-weight: 700; cursor: pointer; }
    .app-empty { text-align: center; padding: 26px 16px; color: #64748b; font-size: 0.9rem; }

    /* Orders Segmented Filter + Order Cards */
    .order-segs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 4px; background: #e2e8f0; border-radius: 12px; margin-bottom: 14px; }
    .order-seg-btn { min-height: 40px; border: 0; border-radius: 9px; background: transparent; color: #475569; font: inherit; font-size: 0.84rem; font-weight: 700; cursor: pointer; white-space: nowrap; }
    .order-seg-btn.active { background: #fff; color: var(--app-navy); box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08); }
    .order-row { border: 1px solid var(--app-line); border-radius: 14px; padding: 14px; display: grid; gap: 8px; margin-bottom: 10px; background: #fff; }
    .order-row-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .order-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
    .order-act-btn { min-height: 40px; padding: 8px 14px; border-radius: 9px; border: 1px solid #cbd5e1; background: #fff; font: inherit; font-size: 0.82rem; font-weight: 700; cursor: pointer; color: var(--app-navy); }
    .order-act-btn.primary { background: var(--app-green); border-color: var(--app-green); color: #fff; }

    /* Profile View */
    .prof-list { display: grid; gap: 10px; }
    .prof-row { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid #f1f5f9; font-size: 0.9rem; }
    .prof-row:last-child { border-bottom: 0; }
    .prof-row span { color: #64748b; font-weight: 600; }
    .prof-row strong { color: var(--app-navy); text-align: right; overflow-wrap: anywhere; }
    .logout-full { width: 100%; min-height: 46px; margin-top: 10px; border-radius: 12px; border: 1px solid #fecaca; background: #fef2f2; color: #b91c1c; font: inherit; font-size: 0.92rem; font-weight: 800; cursor: pointer; }

    /* Modal / Bottom Sheet for List Product & Upload Samples */
    .sheet-backdrop { position: fixed; inset: 0; z-index: 90; background: rgba(11, 31, 58, 0.58); backdrop-filter: blur(2px); display: flex; align-items: flex-end; justify-content: center; padding: 0; }
    @media (min-width: 640px) { .sheet-backdrop { align-items: center; padding: 16px; } }
    .sheet-panel { background: #fff; width: 100%; max-width: 560px; max-height: 90vh; border-radius: 22px 22px 0 0; overflow-y: auto; padding: 18px 18px 26px; box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.22); }
    @media (min-width: 640px) { .sheet-panel { border-radius: 20px; } }
    .sheet-handle { width: 42px; height: 4px; border-radius: 999px; background: #cbd5e1; margin: 0 auto 12px; }
    .sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .sheet-head h3 { margin: 0; font-size: 1.15rem; color: var(--app-navy); }
    .sheet-close { width: 38px; height: 38px; border-radius: 10px; border: 0; background: #f1f5f9; font-size: 1.35rem; cursor: pointer; color: #334155; }

    .f-group { margin-bottom: 12px; }
    .f-group label { display: block; font-size: 0.8rem; font-weight: 700; color: var(--app-navy); margin-bottom: 5px; }
    .f-group input, .f-group select, .f-group textarea { width: 100%; min-height: 44px; padding: 10px 12px; border: 1.5px solid #cbd5e1; border-radius: 10px; font: inherit; font-size: 0.9rem; background: #fff; color: #0f172a; }
    .f-group textarea { min-height: 76px; resize: vertical; }
    .f-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: end; }
    @media (max-width: 440px) { .f-pair { grid-template-columns: 1fr; } }
    .pick-box { border: 1.5px dashed #94a3b8; border-radius: 12px; padding: 12px; text-align: center; background: #f8fafc; cursor: pointer; display: block; }
    .pick-box img, .pick-box video { max-height: 140px; max-width: 100%; border-radius: 8px; margin-top: 8px; }
    .mat-toggle { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border: 1.5px solid #bbf7d0; background: #f0fdf4; border-radius: 10px; margin-bottom: 14px; }
    .mat-toggle label { margin: 0; color: #15803d; font-weight: 800; font-size: 0.88rem; }
    .mat-toggle.locked input[disabled] { opacity: 0.9; cursor: not-allowed; }

    /* Fixed App Bottom Navigation Bar (4 Tabs: Home, Order, Profile, Card) */
    .app-bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 50; background: rgba(255, 255, 255, 0.96); backdrop-filter: blur(10px); border-top: 1px solid var(--app-line); }
    .app-bottom-inner { max-width: 960px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); height: 64px; }
    .app-tab-btn { border: 0; background: transparent; color: #64748b; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; cursor: pointer; font: inherit; min-height: 44px; padding: 4px; }
    .app-tab-btn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
    .app-tab-btn span { font-size: 0.72rem; font-weight: 700; white-space: nowrap; }
    .app-tab-btn.active { color: var(--app-orange); }
    .app-tab-btn.active svg { stroke: var(--app-orange); stroke-width: 2.3; }
  </style>
</head>
<body class="app-body">
  <!-- App Top Bar: Left Address + Right Online Toggle -->
  <header class="app-topbar">
    <div class="app-topbar-inner">
      <div class="app-addr-box">
        <div class="app-pin-ic" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11a7 7 0 10-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
        </div>
        <div class="app-addr-txt">
          <div class="app-addr-kicker" id="top-role-label">Location</div>
          <div class="app-addr-val" id="top-address">Loading address...</div>
        </div>
      </div>

      <div class="app-online-wrap">
        <span class="app-online-txt on" id="top-online-label">Online</span>
        <button type="button" class="switch" id="top-online-switch" role="switch" aria-checked="true" aria-label="Online / Offline Toggle"></button>
      </div>
    </div>
  </header>

  <!-- Main Scrollable App View -->
  <main class="app-main" id="app-content"></main>

  <!-- Bottom Action Sheet Container (List Product / Upload Samples) -->
  <div class="sheet-backdrop" id="app-sheet" hidden role="dialog" aria-modal="true">
    <div class="sheet-panel">
      <div class="sheet-handle"></div>
      <div class="sheet-head">
        <h3 id="sheet-title">Action</h3>
        <button type="button" class="sheet-close" id="sheet-close" aria-label="Close">&times;</button>
      </div>
      <div id="sheet-body"></div>
    </div>
  </div>

  <!-- Fixed 4-Tab Bottom Navigation Bar (No Sidebar) -->
  <nav class="app-bottom-nav" aria-label="App Navigation">
    <div class="app-bottom-inner">
      <button type="button" class="app-tab-btn active" data-tab="home">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5L12 4l9 7.5M5.5 10v10h13V10M10 20v-5.5h4V20"/></svg>
        <span>Home</span>
      </button>
      <button type="button" class="app-tab-btn" data-tab="orders">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7.5L12 3l8 4.5v9L12 21l-8-4.5zM4 7.5l8 4.5 8-4.5M12 12v9"/></svg>
        <span>Order</span>
      </button>
      <button type="button" class="app-tab-btn" data-tab="profile">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c1-4 4-5.5 7.5-5.5s6.5 1.5 7.5 5.5"/></svg>
        <span>Profile</span>
      </button>
      <button type="button" class="app-tab-btn" data-tab="card">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="11" r="2"/><path d="M5.5 16c.5-1.6 1.7-2.4 3-2.4s2.5.8 3 2.4M14 10h4M14 14h4"/></svg>
        <span>Card</span>
      </button>
    </div>
  </nav>

  <script src="config.js?v=20261104d"></script>
  <script src="catalog.js?v=1"></script>
  <script src="pwa.js?v=20261113c"></script>
  <script src="dashboard.js?v=20261114g"></script>
</body>
</html>
