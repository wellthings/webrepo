<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interagood | Dashboard</title>
  <meta name="theme-color" content="#0b1f3a">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="style.css?v=20261106-g">
  <link rel="stylesheet" href="partner.css?v=20261113">
  <style>
    .db-shell { display: flex; min-height: 100vh; background: #f5f7fb; }
    .db-side { width: 256px; background: #0b1f3a; color: #cfe2ff; display: flex; flex-direction: column; position: fixed; top: 0; bottom: 0; z-index: 90; }
    .db-brand { padding: 20px 24px; font-size: 1.25rem; font-weight: 800; color: #fff; border-bottom: 1px solid rgba(255,255,255,0.1); display:flex; align-items:center; justify-content:space-between; }
    .db-brand a { color: #fff; text-decoration: none; }
    .db-user { padding: 16px 24px; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .db-usernm { font-weight: 700; color: #fff; font-size: 1rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dbu-role { font-size: 0.76rem; text-transform: uppercase; letter-spacing: 0.1em; color: #ffb74d; font-weight: 700; margin-top: 2px; }
    .db-nav { flex: 1; padding: 12px 0; overflow-y: auto; }
    .db-nav a { display: flex; align-items: center; gap: 12px; padding: 11px 24px; color: #cfe2ff; text-decoration: none; font-size: 0.92rem; font-weight: 500; border-left: 3px solid transparent; cursor: pointer; }
    .db-nav a:hover { background: rgba(255,255,255,0.06); color: #fff; }
    .db-nav a.active { background: rgba(255,255,255,0.12); color: #fff; border-left-color: #f58220; font-weight: 600; }
    .db-nav a svg { width: 19px; height: 19px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .db-logout { padding: 16px 24px; border-top: 1px solid rgba(255,255,255,0.1); display: grid; gap: 8px; }
    .db-logout button, .db-logout a { width: 100%; padding: 9px 12px; background: rgba(255,255,255,0.08); border: 0; color: #cfe2ff; border-radius: 8px; cursor: pointer; font-size: 0.86rem; text-align: center; text-decoration: none; font-weight: 600; }
    .db-logout button:hover, .db-logout a:hover { background: rgba(255,255,255,0.16); color: #fff; }

    .db-main { margin-left: 256px; flex: 1; padding: 24px 28px 64px; min-width: 0; }
    /* Common Top Control Bar */
    .top-control-bar { background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 16px 20px; margin-bottom: 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 16px; align-items: center; }
    .tcb-block { min-width: 0; }
    .tcb-label { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: #64748b; margin-bottom: 4px; }
    .tcb-val { font-size: 0.92rem; font-weight: 700; color: #0b1f3a; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .tcb-sub { font-size: 0.78rem; color: #475569; margin-top: 2px; font-variant-numeric: tabular-nums; }
    .tcb-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; align-items: center; }
    .tcb-btn { padding: 9px 14px; border-radius: 9px; border: 1px solid #cbd5e1; background: #fff; color: #0b1f3a; font-size: 0.84rem; font-weight: 700; cursor: pointer; font-family: inherit; }
    .tcb-btn.primary { background: #f58220; border-color: #f58220; color: #fff; }
    .tcb-btn.primary:hover { background: #dc6d0f; }
    .tcb-btn.green { background: #1f9d55; border-color: #1f9d55; color: #fff; }
    .tcb-toggle-wrap { display: flex; align-items: center; gap: 10px; }
    .tcb-status-txt { font-size: 0.86rem; font-weight: 800; }
    .tcb-status-txt.on { color: #1f9d55; }
    .tcb-status-txt.off { color: #64748b; }

    .quota-bar { height: 7px; background: #e2e8f0; border-radius: 999px; overflow: hidden; margin-top: 6px; }
    .quota-fill { height: 100%; background: #1f9d55; transition: width 0.25s; }
    .quota-fill.full { background: #dc2626; }

    .db-head h1 { font-size: 1.5rem; margin: 0 0 4px; color: #0b1f3a; }
    .db-head p { color: #64748b; margin: 0 0 20px; font-size: 0.94rem; }
    .db-grid { display: grid; gap: 16px; }
    .db-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 14px; padding: 20px; }
    .db-stat { display: flex; align-items: center; gap: 14px; }
    .db-stat .db-stat-ic { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex: none; }
    .db-stat .db-stat-ic svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; }
    .db-stat h3 { margin: 0; font-size: 1.45rem; color: #0b1f3a; font-variant-numeric: tabular-nums; }
    .db-stat span { font-size: 0.82rem; color: #64748b; }

    .calc-panel { background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 22px; margin-bottom: 22px; }
    .calc-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; }
    .calc-field label { display: block; font-size: 0.82rem; font-weight: 700; color: #0b1f3a; margin-bottom: 6px; }
    .calc-field input, .calc-field select, .calc-field textarea { width: 100%; padding: 10px 12px; border: 1.5px solid #cbd5e1; border-radius: 10px; font: inherit; font-size: 0.9rem; margin-bottom: 0; background: #fff; color: #0f172a; }
    .calc-field textarea { min-height: 76px; resize: vertical; }
    .calc-preview { margin-top: 16px; padding: 14px 18px; border-radius: 12px; background: #f8fafc; border: 1px solid #e2e8f0; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px; }
    .calc-total { font-size: 1.35rem; font-weight: 800; color: #0b1f3a; font-variant-numeric: tabular-nums; }
    .with-mat-label { display: inline-block; color: #15803d; background: #dcfce7; border: 1px solid #86efac; font-size: 0.78rem; font-weight: 800; padding: 3px 10px; border-radius: 6px; letter-spacing: 0.02em; }
    .private-notice { padding: 13px 16px; border-radius: 12px; background: #fffbeb; border: 1.5px solid #fde68a; color: #92400e; font-size: 0.88rem; margin-bottom: 18px; }

    .listing-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
    .listing-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; }
    .listing-media { aspect-ratio: 16 / 10; background: #e2e8f0; position: relative; overflow: hidden; }
    .listing-media img, .listing-media video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .listing-body { padding: 14px; flex: 1; display: flex; flex-direction: column; gap: 6px; }
    .listing-body h4 { margin: 0; font-size: 0.98rem; color: #0b1f3a; }
    .listing-meta { font-size: 0.8rem; color: #64748b; }
    .listing-price { font-size: 1rem; font-weight: 800; color: #0b1f3a; font-variant-numeric: tabular-nums; margin-top: auto; }
    .listing-del { align-self: flex-start; margin-top: 6px; padding: 5px 10px; border: 1px solid #fecaca; background: #fef2f2; color: #b91c1c; border-radius: 7px; font-size: 0.78rem; font-weight: 700; cursor: pointer; }

    .db-empty { text-align: center; padding: 34px 20px; color: #64748b; }
    .db-mob-toggle { display: none; }
    @media (max-width: 820px) {
      .db-side { transform: translateX(-100%); transition: transform 0.25s; }
      .db-side.open { transform: translateX(0); }
      .db-main { margin-left: 0; padding: 66px 16px 48px; }
      .tcb-actions { justify-content: flex-start; }
      .db-mob-toggle { display: flex; align-items: center; justify-content: center; width: 42px; height: 42px; position: fixed; top: 12px; left: 12px; z-index: 101; background: #0b1f3a; color: #fff; border: 0; border-radius: 10px; font-size: 1.2rem; cursor: pointer; }
    }
  </style>
</head>
<body>
  <button class="db-mob-toggle" id="db-menu" aria-label="Menu">&#9776;</button>
  <div class="db-shell">
    <aside class="db-side" id="db-side">
      <div class="db-brand">
        <a href="index.html">Interagood</a>
      </div>
      <div class="db-user">
        <div class="db-usernm" id="db-username">User</div>
        <div class="dbu-role" id="db-role">Partner</div>
      </div>
      <nav class="db-nav" id="db-nav"></nav>
      <div class="db-logout">
        <a href="index.html">View Public Storefront</a>
        <button type="button" id="db-logout-btn">Logout</button>
      </div>
    </aside>

    <main class="db-main">
      <!-- Common Top Control Bar -->
      <section class="top-control-bar" id="top-control-bar" aria-label="Control Bar">
        <div class="tcb-block">
          <div class="tcb-label">Registered Address</div>
          <div class="tcb-val" id="tcb-address">Loading address...</div>
          <div class="tcb-sub" id="tcb-igid"></div>
        </div>

        <div class="tcb-block">
          <div class="tcb-label">Payment Timing &amp; Billing</div>
          <div class="tcb-val" id="tcb-billing">Monthly Cycle</div>
          <div class="tcb-sub" id="tcb-next-bill">Next billing: checking...</div>
        </div>

        <div class="tcb-block">
          <div class="tcb-label" id="tcb-quota-label">Upload Progress</div>
          <div class="tcb-val" id="tcb-quota-val">0 / 4 today</div>
          <div class="quota-bar"><div class="quota-fill" id="tcb-quota-fill" style="width:0%"></div></div>
        </div>

        <div class="tcb-block">
          <div class="tcb-label">Visibility Status</div>
          <div class="tcb-toggle-wrap">
            <button type="button" class="switch" id="tcb-online-switch" role="switch" aria-checked="true" aria-label="Online / Offline Toggle"></button>
            <span class="tcb-status-txt on" id="tcb-online-label">Online</span>
          </div>
          <div class="tcb-sub" id="tcb-online-hint">Visible in admin assignment filters</div>
        </div>

        <div class="tcb-actions">
          <button type="button" class="tcb-btn primary" id="tcb-upload-btn">Upload Sample</button>
          <button type="button" class="tcb-btn" id="tcb-completed-btn">Completed Orders</button>
          <button type="button" class="tcb-btn green" id="tcb-payu-btn">PayU Billing</button>
        </div>
      </section>

      <div class="db-head">
        <h1 id="db-page-title">Dashboard</h1>
        <p id="db-page-sub">Welcome to your Interagood control panel.</p>
      </div>

      <div id="db-content"></div>
    </main>
  </div>

  <script src="config.js?v=20261104d"></script>
  <script src="catalog.js?v=1"></script>
  <script src="pwa.js?v=20261113"></script>
  <script src="dashboard.js?v=20261113"></script>
</body>
</html>
