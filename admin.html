<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel | Interagood</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0b1f3a">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css?v=20261105-e">
  <link rel="stylesheet" href="partner.css?v=20261113">
  <style>
    body.ad { background: #f5f6f8; }
    .ad-main { padding: 24px 0 64px; }
    .ad-wrap { width: min(1140px, 94%); margin: 0 auto; }
    .ad-user { display: flex; align-items: center; gap: 14px; color: var(--navy); font-size: 0.92rem; font-weight: 600; }
    .ad-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
    .ad-bar .tabs { justify-content: flex-start; margin: 0; flex-wrap: wrap; }
    .ad-bar .btn-sm { margin-top: 0; }

    .ad-filters { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 14px 16px; background: #fff; border: 1px solid var(--line); border-radius: 14px; margin-bottom: 16px; }
    .ad-filters label { display: inline-flex; align-items: center; gap: 6px; margin: 0; font-size: 0.86rem; font-weight: 700; color: var(--navy); cursor: pointer; }
    .ad-filters select { width: auto; margin: 0; padding: 7px 12px; border: 1.5px solid #cbd5e1; border-radius: 9px; font-size: 0.86rem; font-weight: 600; }

    .ad-list { display: grid; gap: 14px; }
    .ad-card { border: 1px solid var(--line); border-radius: 14px; background: #fff; padding: 18px; }
    .ad-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
    .ad-no { font-weight: 800; color: var(--navy); }
    .ad-when { color: var(--muted); font-size: 0.82rem; font-weight: 500; }
    .ad-right { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
    .ad-tag { padding: 4px 10px; border-radius: 8px; font-size: 0.74rem; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase; }
    .st-new { background: var(--orange-soft); color: var(--orange-dark); }
    .st-contacted { background: #e6efff; color: #1a62d6; }
    .st-closed { background: #e7f6ee; color: #1f7a45; }
    .st-online { background: #dcfce7; color: #15803d; }
    .st-offline { background: #f1f5f9; color: #64748b; }

    .ad-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; }
    .ad-label { margin: 0 0 4px; color: var(--muted); font-size: 0.74rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; }
    .ad-value { margin: 0; color: var(--ink); font-size: 0.92rem; line-height: 1.45; }
    .ad-value a { color: var(--navy); font-weight: 600; }
    .ad-sub { margin: 16px 0 8px; color: var(--navy); font-size: 0.8rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; }

    .ad-rows { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
    .ad-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg-alt); font-size: 0.88rem; }
    .ad-row b { color: var(--navy); }
    .ad-chip { padding: 2px 10px; border-radius: 8px; background: #fff; border: 1px solid var(--line); color: var(--muted); font-size: 0.76rem; font-weight: 700; }
    .ad-empty { padding: 26px; border: 1px dashed var(--line); border-radius: 14px; background: #fff; color: var(--muted); text-align: center; }
    .ad-select { padding: 7px 10px; border: 1.5px solid #c9d2de; border-radius: 9px; background: #fff; color: var(--navy); font: inherit; font-size: 0.84rem; font-weight: 700; cursor: pointer; width: auto; margin: 0; }
    .ad-select:disabled { opacity: 0.55; cursor: default; }
    .ad-samples-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; margin-top: 8px; }
    .ad-sample-item { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: #f8fafc; }
    .ad-sample-item img { width: 100%; height: 96px; object-fit: cover; display: block; }
    .ad-sample-item div { padding: 6px 8px; font-size: 0.76rem; font-weight: 600; color: var(--navy); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  </style>
</head>
<body class="ad">
  <header class="pp-header">
    <div class="container pp-header-inner">
      <a class="brand" href="admin.html" aria-label="Interagood admin"><span class="brand-name">Interagood Admin</span></a>
      <div class="ad-user">
        <span id="ad-name">Admin</span>
        <button type="button" class="btn-sm" id="ad-logout">Log out</button>
      </div>
    </div>
  </header>

  <main class="ad-main">
    <div class="ad-wrap">
      <div class="ad-bar">
        <div class="tabs" role="tablist" aria-label="Admin sections">
          <button type="button" class="tab active" id="tab-orders" role="tab" aria-selected="true" aria-controls="panel-orders">Orders</button>
          <button type="button" class="tab" id="tab-users" role="tab" aria-selected="false" aria-controls="panel-users">Online Talent &amp; Partner Samples</button>
          <button type="button" class="tab" id="tab-carts" role="tab" aria-selected="false" aria-controls="panel-carts">Live carts</button>
        </div>
        <button type="button" class="btn-sm" id="ad-refresh">Refresh</button>
      </div>

      <p class="hint" id="ad-msg" role="status" aria-live="polite"></p>

      <section id="panel-orders" class="ad-list" role="tabpanel" aria-labelledby="tab-orders">
        <p class="ad-empty">Loading orders&hellip;</p>
      </section>

      <section id="panel-users" class="ad-list" role="tabpanel" aria-labelledby="tab-users" hidden>
        <div class="ad-filters">
          <label><input type="checkbox" id="flt-online-only" checked> Online Users Only</label>
          <label>Role:
            <select id="flt-role">
              <option value="all">All Roles</option>
              <option value="partner">Partners (Private Samples)</option>
              <option value="supplier">Suppliers</option>
              <option value="architect">Architects</option>
            </select>
          </label>
        </div>
        <div id="ad-users-list" class="ad-list">
          <p class="ad-empty">Loading registered professionals&hellip;</p>
        </div>
      </section>

      <section id="panel-carts" class="ad-list" role="tabpanel" aria-labelledby="tab-carts" hidden></section>
    </div>
  </main>

  <script src="config.js?v=20261104d"></script>
  <script src="pwa.js?v=20261113"></script>
  <script src="admin.js?v=20261113"></script>
</body>
</html>
